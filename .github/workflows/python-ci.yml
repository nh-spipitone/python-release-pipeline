name: Python CI

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Scarica il codice
              uses: actions/checkout@v4

            - name: Installa Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Installa dipendenze
              run: pip install -r requirements.txt

            - name: Controlla stile codice
              run: ruff check .

            - name: Esegui test
              run: pytest

    release:
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write

        steps:
            - name: Scarica il codice
              uses: actions/checkout@v4

            - name: Crea archivio del progetto
              run: |
                  zip -r "python-release-pipeline-${GITHUB_REF_NAME}.zip" \
                    src \
                    tests \
                    requirements.txt \
                    pytest.ini \
                    release_check.bat \
                    lezione_pipeline_rilascio_python.md

            - name: Crea GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                    "python-release-pipeline-${GITHUB_REF_NAME}.zip" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --title "Release ${GITHUB_REF_NAME}" \
                    --generate-notes
